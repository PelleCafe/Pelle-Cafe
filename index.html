<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی دیجیتال | Pelle Café</title>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazir');

        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-color: #d4af37;
            --border-color: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazir', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        header { text-align: center; padding: 40px 20px 20px; background: linear-gradient(180deg, #000000 0%, var(--bg-color) 100%); }
        .logo-container { width: 130px; height: 130px; margin: 0 auto; background-color: #111; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--border-color); }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; }

        .category-nav { display: flex; overflow-x: auto; padding: 15px 20px; gap: 15px; position: sticky; top: 0; background-color: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border-color); }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-btn { background-color: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: bold; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .category-btn.active { background-color: var(--text-main); color: var(--bg-color); border-color: var(--text-main); }

        .menu-container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .menu-item { background-color: var(--card-bg); border-radius: 20px; overflow: hidden; display: flex; padding: 15px; gap: 15px; border: 1px solid var(--border-color); animation: fadeIn 0.4s ease; }
        .item-image { width: 80px; height: 80px; border-radius: 15px; background-color: #2a2a2a; object-fit: cover; flex-shrink: 0; }
        .item-details { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .item-title-en { font-size: 15px; font-weight: bold; color: var(--text-main); }
        .item-title-fa { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .item-price { font-size: 15px; font-weight: bold; color: var(--accent-color); direction: ltr; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* لودینگ */
        .loading { text-align: center; padding: 50px; color: var(--text-muted); font-size: 14px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border-color); border-top: 4px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-msg { text-align: center; padding: 20px; color: #ff4444; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- لینک لوگوی پله کافه -->
            <img src="https://i.postimg.cc/85z1X1K3/pelle-logo.png" alt="Pelle Cafe Logo">
        </div>
    </header>

    <div class="category-nav" id="categoryNav"></div>
    
    <div id="loadingBox" class="loading">
        <div class="spinner"></div>
        <p>در حال دریافت منوی کافه...</p>
    </div>

    <div class="menu-container" id="menuContainer"></div>

    <script>
        // 🔴 شناسه (ID) گوگل شیت خودت رو اینجا قرار بده
        const SHEET_ID = '1CR9ReVSNBPtu_8rpRgY8pi0z4YCt3pg0eT9KVO1fb8I'; 
        
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        
        const categoryNav = document.getElementById('categoryNav');
        const menuContainer = document.getElementById('menuContainer');
        const loadingBox = document.getElementById('loadingBox');

        let menuData = [];

        // دریافت اطلاعات از اکسل
        fetch(url)
            .then(res => res.text())
            .then(text => {
                // پاک کردن کدهای اضافه گوگل برای رسیدن به JSON خالص
                const jsonString = text.substring(47).slice(0, -2);
                const json = JSON.parse(jsonString);
                
                // استخراج ردیف‌ها
                const rows = json.table.rows;
                const items = [];

                rows.forEach(row => {
                    // جلوگیری از ارور برای سلول‌های خالی
                    const category = row.c[0] ? row.c[0].v : null;
                    const nameEn = row.c[1] ? row.c[1].v : '';
                    const nameFa = row.c[2] ? row.c[2].v : '';
                    const price = row.c[3] ? row.c[3].v : '';
                    const image = row.c[4] ? row.c[4].v : '';

                    if (category && nameEn) { // فقط اگر دسته‌بندی و اسم داشت وارد لیست بشه
                        items.push({ category, nameEn, nameFa, price, image });
                    }
                });

                // گروه‌بندی محصولات بر اساس دسته‌بندی
                const categories = [...new Set(items.map(i => i.category))];
                categories.forEach(cat => {
                    menuData.push({
                        category: cat,
                        items: items.filter(i => i.category === cat)
                    });
                });

                loadingBox.style.display = 'none';
                renderMenuUI();
            })
            .catch(error => {
                loadingBox.innerHTML = `<p class="error-msg">خطا در ارتباط با سرور. لطفاً اتصال اینترنت را بررسی کنید.</p>`;
                console.error('Error fetching data:', error);
            });

        function renderMenuUI() {
            categoryNav.innerHTML = '';
            menuData.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = cat.category;
                btn.onclick = () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderItemsUI(cat.items);
                    window.scrollTo({ top: 150, behavior: 'smooth' });
                };
                categoryNav.appendChild(btn);
            });

            if (menuData.length > 0) {
                renderItemsUI(menuData[0].items);
            }
        }

        function renderItemsUI(items) {
            menuContainer.innerHTML = '';
            items.forEach(item => {
                const imgSrc = item.image ? item.image : "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2EwYTBhMCIgZm9udC1zaXplPSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPlBlbGxlPC90ZXh0Pjwvc3ZnPg==";
                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `
                    <img src="${imgSrc}" class="item-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2EwYTBhMCIgZm9udC1zaXplPSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPlBlbGxlPC90ZXh0Pjwvc3ZnPg=='">
                    <div class="item-details">
                        <div class="item-header">
                            <span class="item-title-en">${item.nameEn}</span>
                            <span class="item-price">${item.price}t</span>
                        </div>
                        <span class="item-title-fa">${item.nameFa}</span>
                    </div>
                `;
                menuContainer.appendChild(itemDiv);
            });
        }
    </script>
</body>
</html>
